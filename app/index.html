<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Totally Legit Inc.</title>
<meta name="description" content="A co-op call center game. Run ridiculous scams on gullible callers, hit the quota, survive the boss.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2233; --navy2:#2a3450; --navy3:#3a4668; --ink:#0f131d;
  --manila:#f0dfa8; --manila-edge:#b89f55; --manila-ink:#3a2f14;
  --red:#d6342c; --yellow:#ffe14a; --green:#27c07a; --paper:#fbf7ea;
  --text:#eef1f7; --muted:#a3aec6;
  --font-d:'Alfa Slab One','Rockwell','Georgia',serif;
  --font-b:'Karla','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141a28;color:var(--text);font-family:var(--font-b);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.7em 1.1em;border:3px solid var(--ink);border-radius:12px;background:var(--navy2);color:var(--text);font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;text-align:left;line-height:1.15}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--yellow);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.good{background:var(--green);color:var(--ink)}
.btn.small{padding:.38em .7em;border-width:2px;border-radius:9px;box-shadow:0 3px 0 var(--ink);font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,.icon:focus-visible{outline:3px solid #7fd4ff;outline-offset:2px}
.field{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;color:var(--muted)}
.field > span{font-weight:700}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.inp{background:var(--ink);border:2px solid var(--navy3);border-radius:9px;padding:.55em .7em;color:var(--text);width:100%}
.field input[type=range]{width:100%;accent-color:var(--yellow)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.end{align-items:flex-end}
.grow{flex:1 1 0;min-width:0}
.note{font-size:.85rem;color:var(--muted);line-height:1.4;max-width:60ch}
.note.warn{color:#ffd08a}
.check{display:flex;gap:.5rem;align-items:center;color:var(--text);font-size:.92rem}
.check input{width:1.1rem;height:1.1rem;accent-color:var(--yellow)}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:40;display:flex;overflow:auto;background:linear-gradient(90deg,rgba(20,26,40,.97) 0,rgba(20,26,40,.93) 30rem,rgba(20,26,40,.4) 58rem,rgba(20,26,40,.12))}
.menu-col{width:min(40rem,100%);padding:clamp(1.2rem,5vh,3.2rem) clamp(1.2rem,4vw,3.4rem);display:flex;flex-direction:column;gap:1.5rem;min-height:100%}
.logo{font-family:var(--font-d);font-weight:400;font-size:clamp(2.5rem,7vw,4.3rem);line-height:.95;color:var(--yellow);text-shadow:4px 4px 0 var(--ink);position:relative;width:max-content;max-width:100%}
.logo .inc{color:var(--text)}
.stamp{display:inline-block;transform:rotate(-7deg);border:3px solid var(--red);color:#ff6a61;font-weight:800;font-size:.95rem;padding:.15em .6em;border-radius:6px;margin:.2rem 0 0 .4rem;letter-spacing:.02em}
.tagline{color:var(--muted);max-width:44ch;line-height:1.45}
.screen{display:none;flex-direction:column;gap:1rem}
.screen.on{display:flex}
.screen h2{font-family:var(--font-d);font-weight:400;font-size:1.6rem;color:var(--text)}
.screen h3{font-size:1.05rem;font-weight:800}
.home-btns{display:flex;flex-direction:column;gap:.8rem;max-width:22rem}
.home-btns .btn{font-size:1.15rem;padding:.8em 1.1em;justify-content:flex-start}
.back{align-self:flex-start}
.panel{background:rgba(42,52,80,.75);border:2px solid var(--navy3);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.tcard{background:var(--manila);color:var(--manila-ink);border-radius:8px;padding:.7rem;border:2px solid var(--manila-edge);box-shadow:3px 4px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:.45rem;min-height:11.5rem;position:relative}
.tcard::before{content:"";position:absolute;top:.5rem;right:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:#1d2538;box-shadow:inset 1px 1px 0 rgba(0,0,0,.5)}
.tcard h4{font-size:.82rem;font-weight:800}
.tcard .big{font-family:var(--font-d);font-size:1.25rem;line-height:1.05}
.tcard .sub{font-size:.8rem;line-height:1.3}
.tcard .days{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tcard .days span{border:1.5px solid var(--manila-edge);font-size:.62rem;text-align:center;padding:.15rem 0;font-weight:800}
.tcard .days span.done{background:var(--red);color:#fff;border-color:var(--red)}
.tcard .days span.now{background:#fff6cf;border-color:var(--manila-ink)}
.tcard .acts{margin-top:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.tcard .btn{color:var(--text)}
.tcard .btn.primary{color:var(--ink)}
.tcard.sel{outline:4px solid var(--yellow);outline-offset:2px}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 var(--ink);align-self:flex-start}
.seg button{border:0;background:var(--navy2);padding:.55em 1em;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--ink)}
.code-inp{font-family:var(--font-d);font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;width:11rem!important}
.status{min-height:1.4em;font-weight:700}
.status.bad{color:#ff8b84}.status.ok{color:#7ee0b0}
.how li{margin:.35rem 0;line-height:1.45;max-width:62ch}
.how ul{margin:0;padding-left:1.2rem}
kbd{background:var(--ink);border:2px solid var(--navy3);border-bottom-width:4px;border-radius:6px;padding:0 .4em;font-family:var(--font-b);font-weight:800;font-size:.85em}
.foot{margin-top:auto;font-size:.8rem;color:var(--muted)}

/* ---------- modal (settings, pause) ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,13,22,.72);display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--navy);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 rgba(0,0,0,.5);width:min(46rem,100%);max-height:min(92vh,48rem);display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:var(--navy2);border-bottom:3px solid var(--ink)}
.modal header h2{font-family:var(--font-d);font-weight:400;font-size:1.3rem}
.tabs{display:flex;gap:.3rem;padding:.6rem 1rem 0;flex-wrap:wrap}
.tabs button{border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:var(--navy2);padding:.45em .8em;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--yellow);color:var(--ink)}
.modal .body{padding:1rem;overflow:auto;display:flex;flex-direction:column;gap:.9rem;border-top:3px solid var(--ink)}
.swatches{display:flex;gap:.4rem;flex-wrap:wrap}
.swatches button{width:2rem;height:2rem;border-radius:50%;border:3px solid var(--ink)}
.swatches button.on{outline:3px solid var(--yellow);outline-offset:2px}
#pause .modal{width:min(22rem,100%)}
#pause .body{border-top:0}
#pause .btn{justify-content:center}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#hud-prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:rgba(15,19,29,.85);border:2px solid var(--ink);border-radius:10px;padding:.4em .8em;font-weight:800}
#hud-stats{position:absolute;right:1rem;top:1rem;background:rgba(15,19,29,.85);border:2px solid var(--ink);border-radius:12px;padding:.55rem .8rem;text-align:right;font-weight:800;line-height:1.35}
#hud-stats .q{color:var(--yellow)} #hud-stats .g{color:var(--green)} #hud-stats .r{color:#ff8b84}
#hud-left{position:absolute;left:1rem;top:1rem;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.chip{background:rgba(15,19,29,.85);border:2px solid var(--ink);border-radius:10px;padding:.35em .7em;font-weight:800;font-size:.92rem}
.chip.room b{font-family:var(--font-d);font-weight:400;letter-spacing:.12em;color:var(--yellow);font-size:1.1rem}
.chip.live{color:var(--green)} .chip.mute{color:var(--muted)}
#hud-ring{position:absolute;left:50%;top:1rem;transform:translateX(-50%);background:var(--green);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:.4em .9em;font-weight:800;animation:wiggle .5s infinite}
#hud-hint{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%);background:rgba(15,19,29,.8);border-radius:10px;padding:.5em .9em;font-size:.9rem;white-space:nowrap}
#daycard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:rgba(15,19,29,.55);opacity:0;transition:opacity .5s}
#daycard.on{opacity:1}
#daycard h1{font-family:var(--font-d);font-weight:400;font-size:clamp(2.4rem,8vw,5rem);color:var(--yellow);text-shadow:5px 5px 0 var(--ink)}
#daycard p{font-size:1.3rem;font-weight:800}
@keyframes wiggle{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg)}}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(34rem,92vw)}
.toast{background:var(--ink);border:2px solid var(--navy3);border-radius:10px;padding:.5em .9em;font-weight:700;transition:opacity .4s,transform .4s;text-align:center}
.toast.good{border-color:var(--green);color:#9ff0c8}
.toast.bad{border-color:var(--red);color:#ffb0aa}
.toast.out{opacity:0;transform:translateY(8px)}

/* ---------- desktop OS ---------- */
#os{position:fixed;inset:0;z-index:10;background:#f3a25c;color:var(--ink);overflow:hidden;animation:osin .25s ease-out}
@keyframes osin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#os-wall{position:absolute;inset:0 0 3.6rem 0}
#os-wall svg{width:100%;height:100%;display:block}
#os-icons{position:absolute;inset:.8rem .8rem 4.4rem .8rem;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:.5rem .6rem}
.icon{width:5.6rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;background:none;border:2px solid transparent;border-radius:10px;padding:.35rem .2rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.5);font-weight:700;font-size:.78rem;line-height:1.1;text-align:center}
.icon:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}
.icon i{width:3rem;height:3rem;border-radius:12px;border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:1.55rem;box-shadow:0 3px 0 var(--ink);text-shadow:none}
#os-wins{position:absolute;inset:0 0 3.6rem 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.35);pointer-events:auto;overflow:hidden;min-width:14rem;max-width:calc(100vw - 8px);max-height:calc(100vh - 3.6rem - 44px)}
.win.min{display:none}
.win .tb{display:flex;align-items:center;gap:.5rem;padding:.35rem .4rem .35rem .7rem;font-weight:800;color:#fff;cursor:grab;user-select:none;border-bottom:3px solid var(--ink);touch-action:none}
.win .tb .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.win .tb button{width:1.7rem;height:1.5rem;border:2px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font-weight:800;line-height:1;display:grid;place-items:center;padding:0}
.win .tb button.x{background:#ff6a61}
.win .wb{flex:1;overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;min-height:0}
.win .btn{color:var(--text)} .win .btn.primary,.win .btn.good{color:var(--ink)}
.win h3{font-size:1.1rem;font-weight:800}
.win p{line-height:1.4}
.win .muted{color:#6b6453;font-size:.88rem}
.win .inp{background:#fff;color:var(--ink);border:2px solid var(--ink)}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:3.6rem;background:var(--ink);display:flex;align-items:center;gap:.4rem;padding:0 .6rem;color:var(--text)}
#taskbar .tbtn{width:2.6rem;height:2.6rem;border-radius:10px;border:2px solid #000;display:grid;place-items:center;font-size:1.25rem;background:var(--navy2);position:relative}
#taskbar .tbtn.open::after{content:"";position:absolute;bottom:-5px;left:25%;right:25%;height:3px;border-radius:2px;background:var(--yellow)}
#taskbar .tbtn.alert{animation:pulse .6s infinite alternate}
@keyframes pulse{to{background:var(--green)}}
#tb-power{background:var(--red)!important;color:#fff}
#tb-run{display:flex;gap:.35rem;overflow:hidden;flex:1;min-width:0}
#tb-stats{margin-left:auto;text-align:right;font-weight:800;font-size:.82rem;line-height:1.25;white-space:nowrap}
#tb-stats .g{color:var(--green)} #tb-stats .q{color:var(--yellow)} #tb-stats .r{color:#ff8b84}
#tb-clock{text-align:center;font-weight:700;font-size:.9rem;line-height:1.25;padding:0 .6rem;border-left:2px solid var(--navy3);white-space:nowrap}
#powermenu{position:absolute;left:.6rem;bottom:4rem;background:var(--navy);border:3px solid var(--ink);border-radius:12px;padding:.5rem;display:flex;flex-direction:column;gap:.4rem;z-index:9000;box-shadow:5px 5px 0 rgba(0,0,0,.4);min-width:13rem}
#powermenu .btn{justify-content:flex-start}
#os-fx{position:absolute;inset:0;pointer-events:none;z-index:9500;display:grid;place-items:center}
.cashfx{font-family:var(--font-d);font-size:clamp(4rem,16vw,11rem);color:#2bff7a;text-shadow:6px 6px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:cash 1.7s ease-out forwards}
.cashfx.bad{color:#ff5148}
@keyframes cash{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.15) rotate(-5deg);opacity:1}70%{transform:scale(1) rotate(-5deg);opacity:1}100%{transform:scale(1.05) translateY(-40px) rotate(-5deg);opacity:0}}

/* phone app */
.win.phone .wb{background:#161d2e;color:var(--text);padding:.6rem;gap:.5rem}
.trust{background:#0f131d;border:2px solid #000;border-radius:10px;padding:.5rem .6rem}
.trust .top{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
.trust .bar{height:.5rem;background:#2a3450;border-radius:4px;margin-top:.35rem;overflow:hidden}
.trust .bar i{display:block;height:100%;width:50%;background:var(--green);transition:width .4s,background .4s}
.caller{background:#22304a;border:2px solid #000;border-radius:10px;overflow:hidden;text-align:center}
.caller .nm{background:#0f131d;padding:.3rem;font-weight:800;letter-spacing:.03em}
.caller .face{height:8.2rem;display:grid;place-items:center;position:relative;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.05) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.05) 23px 24px)}
.caller .face svg{height:7.6rem}
.caller .face .wait{color:var(--muted);font-weight:700;padding:0 1rem}
.caller .ringbtns{display:flex;gap:.5rem;justify-content:center;padding:.5rem}
.log{flex:1;min-height:6rem;background:#0f131d;border:2px solid #000;border-radius:10px;padding:.5rem;overflow:auto;display:flex;flex-direction:column;gap:.4rem}
.bub{max-width:86%;padding:.4rem .6rem;border-radius:10px;line-height:1.3;font-size:.92rem;word-wrap:break-word}
.bub.you{align-self:flex-end;background:#6b3b1e;color:#ffe2c4}
.bub.them{align-self:flex-start;background:#1f3f7a;color:#dbe8ff}
.bub.sys{align-self:center;background:none;color:var(--muted);font-size:.8rem;font-weight:700}
.bub b{display:block;font-size:.72rem;opacity:.8}
.bub.typing{opacity:.7;font-style:italic}
.phone .inrow{display:flex;gap:.4rem}
.phone .inrow input{flex:1;min-width:0;background:#0f131d;border:2px solid #000;border-radius:9px;padding:.5em .6em;color:var(--text)}
.phone .ctl{display:flex;gap:.4rem;align-items:center}
.phone .ctl .btn.small{padding:.45em .6em}
.phone .ctl .on{background:var(--green);color:var(--ink)}
.phone .ctl .rec{background:var(--red);color:#fff;animation:pulse2 .7s infinite alternate}
@keyframes pulse2{to{filter:brightness(1.4)}}
.phone select{background:#0f131d;border:2px solid #000;border-radius:9px;padding:.4em .5em;color:var(--text);flex:1;min-width:0}

/* scheme app */
.sch-head{display:flex;gap:.7rem;align-items:center}
.sch-head i{width:3.2rem;height:3.2rem;border-radius:12px;border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:1.7rem;flex:none}
.reward{font-weight:800;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.reward b{color:#0d8a52;font-family:var(--font-d);font-weight:400;font-size:1.5rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.steps li{display:flex;gap:.6rem;align-items:flex-start;border:2px solid var(--ink);border-radius:10px;padding:.5rem .6rem;background:#fff;line-height:1.3}
.steps li .n{width:1.5rem;height:1.5rem;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.steps li.done{background:#d8f6e6}
.steps li.done .n{background:#0d8a52}
.steps li.cur{box-shadow:inset 4px 0 0 var(--yellow)}
.banner{border-left:5px solid #0d8a52;background:#e3f7ec;padding:.5rem .7rem;font-weight:800;color:#0b6b40;border-radius:6px}
.banner.bad{border-color:var(--red);background:#fde6e4;color:#9d1f18}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.files button{border:2px solid var(--ink);border-radius:9px;background:#fff;padding:.5rem .3rem;font-size:.78rem;font-weight:700;word-break:break-word;color:var(--ink)}
.files button.on{background:var(--yellow)}
.filebody{background:#fff;border:2px solid var(--ink);border-radius:9px;padding:.6rem;white-space:pre-wrap;font-family:'Courier New',monospace;font-size:.9rem;min-height:5rem}
table.pay{width:100%;border-collapse:collapse}
table.pay td,table.pay th{border-bottom:2px solid #d9d2bd;padding:.35rem .3rem;text-align:left}
table.pay td:last-child,table.pay th:last-child{text-align:right;font-weight:800}
.popup .wb{background:#fff7c2;text-align:center;align-items:center}
.popup .wb b{font-size:1.1rem}
.clip{font-size:4rem;border:3px solid var(--ink);border-radius:50%;width:7rem;height:7rem;background:#fff;align-self:center;box-shadow:0 5px 0 var(--ink)}
.clip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.doodle canvas{border:2px solid var(--ink);border-radius:8px;background:#fff;touch-action:none;width:100%;cursor:crosshair}
.pal{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.pal button{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--ink)}
.pal button.on{outline:3px solid var(--ink);outline-offset:1px}

/* ---------- review ---------- */
#review{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:1rem;background:linear-gradient(0deg,rgba(10,13,22,.85),rgba(10,13,22,0) 70%);pointer-events:none}

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;

    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;

}

    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; } },
    del(k) { try { if (ok) localStorage.removeItem(k); } catch (e) {} delete mem[k]; }

/* =====================================================================

   ===================================================================== */
const AudioSys = {
  ctx: null, master: null, sfx: null, voice: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);
    this.voice = this.ctx.createGain(); this.voice.connect(this.master);
    this.applyVolumes();
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  applyVolumes() {
    if (!this.ctx) return;
    this.master.gain.value = settings.master; this.sfx.gain.value = settings.sfx; this.voice.gain.value = settings.voice;
  },
  tone(freq, dur, type = 'sine', vol = 0.2, when = 0, slideTo = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.sfx); o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, vol = 0.15, when = 0, freq = 1200) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t0);
  }
};

  },
  async start(onInterim, onFinal, onErr) {

      try { r.start(); } catch (e) { this.active = false; onErr && onErr('Could not start listening.'); }
    } else {
      try {
        const stream = await Voice.getMic(true);

        const mr = new MediaRecorder(stream); this.mr = mr; this.chunks = [];
        mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
        mr.onstop = async () => {

          try {
            const blob = new Blob(this.chunks, { type: mr.mimeType || 'audio/webm' });

            const res = await fetch(AI.base() + '/audio/transcriptions', { method: 'POST', headers: { Authorization: 'Bearer ' + settings.apiKey }, body: fd });
            if (!res.ok) throw new Error('transcription failed (' + res.status + ')');

        };

      } catch (e) { this.active = false; onErr && onErr('Microphone not available.'); }
    }
  },
  stop() {
    if (this.rec) { try { this.rec.stop(); } catch (e) {} }
    if (this.mr && this.mr.state !== 'inactive') { try { this.mr.stop(); } catch (e) {} }
  },
  abort() {
    this._cancel = true;

    if (this.mr && this.mr.state !== 'inactive') { this.chunks = []; try { this.mr.stop(); } catch (e) {} }

  const pin = String(randi(1000, 9999));

  const giftpin = digits(4), acct = digits(3) + ' ' + digits(3), bankpin = digits(4), otp = digits(6);
  const files = shuffle([
    { n: 'shopping.txt', c: 'eggs\nmilk\nmore eggs\nwhy are there so many eggs' },
    { n: 'passwords.txt', c: 'email: password123\nstreaming: password1234 (more secure)' },
    { n: 'cat_pics (4,812)', c: '[4,812 photos of the same cat, slightly different angles]' },
    { n: pick(['customer_card.txt', 'IMPORTANT.txt', 'note_to_self.txt', 'do_not_lose.txt']), c: 'Totally Legit Inc.\nMy customer PIN: ' + pin + '\n(do not tell anyone, except people who ask nicely)' },

  model() { return settings.model || (PROVIDERS[settings.provider] || {}).model || ''; },
  hasKey() { return settings.provider !== 'offline' && !!this.base() && (!!settings.apiKey || settings.provider === 'custom'); },
  available() { return this.hasKey() || (Net.active && !Net.isHost && Net.hostAI); },
  headers() { const hd = { 'Content-Type': 'application/json' }; if (settings.apiKey) hd.Authorization = 'Bearer ' + settings.apiKey; return hd; },

      }
      const data = await res.json();
      const txt = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!txt) throw new Error('empty reply');

    } catch (e) {
      if (e.name === 'AbortError') throw new Error('timed out');
      throw e;

    const res = await fetch(this.base() + '/models', { headers: this.headers() });

};

function parseTurn(txt) {
  let t = String(txt || '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); let o = null;
  if (a >= 0 && b > a) { try { o = JSON.parse(t.slice(a, b + 1)); } catch (e) { o = null; } }
  if (!o || typeof o.say !== 'string') {
    const plain = t.replace(/[{}\[\]"]/g, '').replace(/\b(say|trust_delta|steps_done|hangup)\s*:/g, '').trim();
    return { say: plain.slice(0, 300) || '...', trust_delta: 0, steps_done: [], hangup: false };
  }
  return {
    say: o.say.slice(0, 420),
    trust_delta: clamp(Math.round(+o.trust_delta || 0), -25, 20),
    steps_done: Array.isArray(o.steps_done) ? o.steps_done.map(Number).filter(Number.isInteger).map(n => n - 1) : [],
    hangup: !!o.hangup
  };
}

function buildMessages(call, greeting) {
  const c = call.caller, s = call.scheme, lang = LANGS[settings.lang] || 'English';
  let sys = 'You are voicing a fictional phone caller in a silly comedy video game called "Totally Legit Inc.". Everything here is make-believe and played for laughs. Keep it PG-13.\n\n'
    + 'YOUR CHARACTER: ' + c.name + ', age ' + c.age + '. ' + c.persona.desc + ' Quirk: ' + c.quirk + '.\n'
    + 'You rang this number because a flyer, pop-up or voicemail told you to. The player is a call-center agent running a ridiculous scam on you. Your character does not know it is a scam and reacts the way that personality would.\n';
  if (c.baiter) sys += 'SECRET: you are actually a scambaiter streamer wasting the agent\'s time. Act gullible and over-enthusiastic, ask pointless questions, drag things out, and drop tiny hints (mention "chat" then correct yourself). Still mark checklist steps as done when the agent earns them, so they think it is working.\n';
  if (s) {
    sys += '\nTHE SCHEME THE AGENT IS RUNNING (their private notes, not something you know): "' + s.name + '" — ' + s.pitch + '\nTHE AGENT\'S CHECKLIST (you judge it):\n';
    s.steps.forEach((st, i) => { sys += (i + 1) + '. ' + st.t + (st.pin ? ' (the game handles this one, never mark it)' : ' [needs trust ' + st.min + '+]') + (call.steps[i] ? '  -- ALREADY DONE' : '') + '\n'; });
    if (s.steps.some(st => st.remote)) sys += 'NosyViewer is a pretend remote-access app. If asked for your customer PIN, say you cannot remember it but it is written down somewhere on your computer.\n';
    const fl = s.steps.filter(st => st.form);
    if (fl.length) sys += 'YOUR PRETEND DETAILS (invented by the game, safe to say out loud): ' + fl.map(st => st.form.map(f => f.say + ': ' + c[f.f]).join('; ')).join('; ') + '.\nRead a detail out clearly, exactly as written, only when the agent asks for that detail, every earlier checklist step is done, and trust is at least ' + Math.min(...fl.map(st => st.min)) + '. Give one detail per reply. Otherwise stall or refuse in character.\n';
  } else {
    sys += '\nThe agent has not started their story yet. Chat in character and ask why you were told to call.\n';
  }
  sys += '\nCURRENT TRUST: ' + Math.round(call.trust) + '/100 (' + moodOf(call.trust) + ').\n'
    + 'RULES:\n- Stay in character. "say" is 1-2 short spoken sentences. No stage directions, no emoji.\n'
    + '- Speak ' + lang + '.\n'
    + '- trust_delta is an integer from -20 to 15. Reward charm, confidence, creativity, using your name and playing to your personality. Punish rudeness, pushiness, contradictions and anything your character would see through.\n'
    + '- steps_done lists the checklist numbers that the agent\'s LATEST message has genuinely achieved. Go in order, never skip ahead, and only when trust is high enough. Be fair: a decent, funny attempt should work when trust is high enough.\n'
    + '- hangup is true only when you are fed up or the call is clearly over.\n'
    + '- Apart from any pretend details listed above, never give card numbers, addresses or other personal data. If you agree to pay, just say so in character.\n'
    + 'Reply with ONLY this JSON and nothing else: {"say":"...","trust_delta":0,"steps_done":[],"hangup":false}';
  const msgs = [{ role: 'system', content: sys }];
  const hist = call.history.filter(m => m.who !== 'sys').slice(-14);
  if (!hist.length || hist[0].who === 'them') msgs.push({ role: 'user', content: '(The call connects.)' });
  for (const m of hist) {
    msgs.push(m.who === 'you' ? { role: 'user', content: m.text.slice(0, 600) }
      : { role: 'assistant', content: JSON.stringify({ say: m.text, trust_delta: 0, steps_done: [], hangup: false }) });
  }
  if (greeting) msgs.push({ role: 'user', content: '(Say hello in character and mention why you are calling. Do not change trust.)' });
  return msgs;
}

/* scripted callers: keyword + trust heuristics, used when no AI is set up or it fails */
const RUDE = ['idiot', 'stupid', 'shut up', 'dumb', 'moron', 'hate you', 'loser', 'old fool', 'damn', 'hell '];
const POLITE = ['please', 'thank', 'sir', "ma'am", 'madam', 'sorry', 'lovely', 'wonderful', 'appreciate', 'pleasure', 'of course'];
function offlineReply(call, text) {
  const c = call.caller, L = c.baiter ? BAITER_L : c.persona.L, t = ' ' + text.toLowerCase() + ' ';
  let delta = 0; const done = [];
  if (RUDE.some(w => t.includes(w))) return { say: pick(call.trust < 30 ? L.rage : L.bad), trust_delta: -18, steps_done: [], hangup: call.trust < 30 };
  if (call.lastYou && call.lastYou === t) delta -= 7;
  call.lastYou = t;
  if (POLITE.some(w => t.includes(w))) delta += 4;
  if (!call.usedName && (t.includes(c.first.toLowerCase()) || t.includes(c.last.toLowerCase()))) { delta += 6; call.usedName = true; }
  const words = text.trim().split(/\s+/).length;
  if (words < 3) delta -= 3; else if (words >= 8) delta += 2;
  if (text.length > 12 && text === text.toUpperCase() && /[A-Z]/.test(text)) delta -= 6;
  const s = call.scheme;
  if (!s) return { say: pick(L.meh.concat(['So what is this about, exactly?', 'Why was I told to call this number?'])), trust_delta: clamp(delta, -6, 5), steps_done: [], hangup: false };
  const next = call.steps.indexOf(false), st = next >= 0 ? s.steps[next] : null;
  if (st && !st.pin) {
    const hit = st.k.some(k => t.includes(k)) || (st.num && /\d/.test(t));
    if (hit && call.trust + delta >= st.min) {
      done.push(next);
      const last = next === s.steps.length - 1;
      const say = st.remote ? pick(['Okay... I clicked the thing. It says "NosyViewer connected". Is that good?', 'Alright, it is open. I can see the little arrow moving. Is that you?'])
        : last ? pick(L.close) : pick(L.step);
      return { say, trust_delta: clamp(delta + randi(4, 9), -20, 15), steps_done: done, hangup: false };
    }
    if (hit) return { say: pick(L.low), trust_delta: clamp(delta + randi(1, 4), -20, 15), steps_done: [], hangup: false };
    const good = delta > 0 || Math.random() < 0.4;
    return { say: pick(good ? L.ok : L.meh), trust_delta: clamp(delta + (good ? randi(1, 4) : randi(-4, 1)), -20, 15), steps_done: [], hangup: false };
  }
  if (st && st.form) {
    const ok = call.formOk || {}, hits = st.form.filter(f => !ok[f.f] && f.k.some(k => t.includes(k)));
    if (hits.length && call.trust + delta >= st.min) return { say: hits.map(f => f.reveal(c)).join(' '), trust_delta: clamp(delta + 2, -20, 15), steps_done: [], hangup: false };
    return { say: pick(hits.length ? L.low : L.meh), trust_delta: clamp(delta + (hits.length ? 2 : 0), -6, 5), steps_done: [], hangup: false };
  }
  if (st && st.pin) {
    return { say: pick(['My PIN? Oh, I can never remember it. I wrote it down on the computer somewhere.', 'It is in one of my files. You have the screen, you look!', 'Something with numbers. Four of them, I think?']), trust_delta: clamp(delta, -5, 3), steps_done: [], hangup: false };
  }
  return { say: pick(L.ok), trust_delta: 0, steps_done: [], hangup: false };
}

function updateWorld(dt, t) {
  W.t = t; const cam = W.camera;
  if (G.phase === 'menu') {
    cam.position.set(Math.cos(t * 0.05) * 9.5, 2.55, Math.sin(t * 0.05) * 6.2);
    cam.rotation.set(0, 0, 0); cam.lookAt(0, 1.2, 0); cam.rotation.order = 'YXZ';
  } else if (P.cam) {
    const c = P.cam; c.t = Math.min(1, c.t + dt / c.dur); const k = c.t * c.t * (3 - 2 * c.t);
    cam.position.set(lerp(c.fx, c.tx, k), lerp(c.fy, c.ty, k), lerp(c.fz, c.tz, k));

  } else if (P.seated) {
    const d = W.desks[P.seat]; cam.position.set(d.eye.x, d.eye.y, d.eye.z); cam.rotation.set(-0.08, d.rot, 0);
  } else if (P.review >= 0) {
    cam.position.set(P.pos.x, 1.2, P.pos.z); cam.rotation.set(P.pitch, P.yaw + Math.sin(t * 0.4) * 0.02, 0);
  } else {
    if (Game.canControl()) {
      let f = ((Keys.KeyW || Keys.ArrowUp) ? 1 : 0) - ((Keys.KeyS || Keys.ArrowDown) ? 1 : 0), s = ((Keys.KeyD || Keys.ArrowRight) ? 1 : 0) - ((Keys.KeyA || Keys.ArrowLeft) ? 1 : 0);
      const sp = ((Keys.ShiftLeft || Keys.ShiftRight) ? 5.2 : 3.2) * (P.boost > 0 ? 1.35 : 1);
      let dx = 0, dz = 0;
      if (f || s) { const l = Math.hypot(f, s); f /= l; s /= l; const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw); dx = (-sy * f + cy * s) * sp * dt; dz = (-cy * f - sy * s) * sp * dt; }

      if (stuck || !blocked(P.pos.x + dx, P.pos.z)) P.pos.x += dx;
      if (stuck || !blocked(P.pos.x, P.pos.z + dz)) P.pos.z += dz;
      P.pos.x = clamp(P.pos.x, -11.6, 19.6); P.pos.z = clamp(P.pos.z, -8.6, 8.6);
      P.speed = (f || s) ? sp : 0;
      if (Keys.Space && P.pos.y <= 0) P.vy = 4.3;
      if (Keys.KeyF) tryThrow();
    } else P.speed = 0;
    P.vy -= 12 * dt; P.pos.y += P.vy * dt; if (P.pos.y <= 0) { P.pos.y = 0; P.vy = 0; }
    if (P.boost > 0) P.boost -= dt;
    P.bob += dt * P.speed * 2.6;
    cam.position.set(P.pos.x, P.pos.y + P.eye + (P.speed ? Math.sin(P.bob) * 0.035 : 0), P.pos.z);
    cam.rotation.set(P.pitch, P.yaw, 0);
  }
  updateAvatars(dt, t); updateBalls(dt);
  // what is the player looking at?
  let best = null, bd = 2.3;
  if (Game.canControl() && !P.seated && P.review < 0) {
    const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw), cp = Math.cos(P.pitch);
    for (const it of W.interact) {
      const dx = it.pos.x - cam.position.x, dy = it.pos.y - cam.position.y, dz = it.pos.z - cam.position.z, d = Math.hypot(dx, dy, dz);
      if (d > bd) continue;
      const dot = (dx * -sy * cp + dy * Math.sin(P.pitch) + dz * -cy * cp) / (d || 1);

  applyMode() {

  attach(id, stream) {

  detach(id) { const n = this.nodes.get(id); if (!n) return; try { n.src.disconnect(); n.pan.disconnect(); n.el.srcObject = null; } catch (e) {} this.nodes.delete(id); },
  detachAll() { for (const id of [...this.nodes.keys()]) this.detach(id); },
  update() {

/* =====================================================================
   NET — PeerJS. The host is the authority; voice is a peer-to-peer mesh.
   ===================================================================== */
const ROOM_PREFIX = 'tli-v1-';
const Net = {
  active: false, isHost: false, peer: null, conns: new Map(), hostConn: null, myId: 'me', room: '', players: new Map(), hostAI: false,
  waiters: new Map(), rid: 0, media: new Map(), sendT: 0, errT: 0,
  libUrls: ['vendor/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'],

  async lib() { if (window.Peer) return; try { await loadScript(this.libUrls); } catch (e) { throw new Error('Could not load the multiplayer library. Check your internet connection.'); } if (!window.Peer) throw new Error('Multiplayer library failed to start.'); },
  opts() { const o = { debug: 0 }; if (settings.peerHost) { o.host = settings.peerHost; if (settings.peerPort) o.port = +settings.peerPort; o.path = settings.peerPath || '/'; o.secure = !!settings.peerSecure; } return o; },
  me() { return { name: settings.name, color: settings.color, x: +P.pos.x.toFixed(2), y: +P.pos.y.toFixed(2), z: +P.pos.z.toFixed(2), ry: +P.yaw.toFixed(2), seat: P.seated ? P.seat : (P.review >= 0 ? -10 - P.review : -1), talk: Voice.talking, personal: G.personal }; },
  plObj() { const o = {}; for (const [id, p] of this.players) o[id] = p; return o; },

  async host() {
    await this.lib(); AudioSys.resume();
    const code = await new Promise((res, rej) => {
      let n = 0;
      const attempt = () => {
        const code = Array.from({ length: 5 }, () => pick('ABCDEFGHJKLMNPQRSTUVWXYZ23456789')).join('');
        const peer = new Peer(ROOM_PREFIX + code, this.opts()); let opened = false;
        const to = setTimeout(() => { if (!opened) { try { peer.destroy(); } catch (e) {} rej(new Error('Could not reach the matchmaking server. Try again in a moment.')); } }, 15000);
        peer.on('open', () => { opened = true; clearTimeout(to); this.peer = peer; res(code); });
        peer.on('error', e => {
          if (opened) return this.peerErr(e);
          clearTimeout(to); try { peer.destroy(); } catch (_) {}
          if (e.type === 'unavailable-id' && n++ < 4) attempt(); else rej(new Error(e.message || e.type));
        });
      };
      attempt();
    });
    this.active = true; this.isHost = true; this.room = code; this.myId = this.peer.id; this.hostAI = AI.hasKey();
    this.players.clear(); this.players.set(this.myId, this.me()); this.bind(); Voice.start();
    return code;
  },
  async join(code) {
    await this.lib(); AudioSys.resume(); code = String(code || '').trim().toUpperCase();
    if (code.length < 4) throw new Error('Enter the room code from the host.');
    const welcome = await new Promise((res, rej) => {
      const peer = new Peer(this.opts()); let done = false;
      const fail = m => { if (done) return; done = true; clearTimeout(to); try { peer.destroy(); } catch (e) {} rej(new Error(m)); };
      const to = setTimeout(() => fail('Timed out. Check the room code and try again.'), 16000);
      peer.on('open', id => {
        const conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
        conn.on('open', () => conn.send({ t: 'hello', name: settings.name, color: settings.color, v: VERSION }));
        conn.on('data', d => {
          if (done && this.hostConn === conn) return this.clientRecv(d);
          if (d && d.t === 'welcome') { done = true; clearTimeout(to); this.peer = peer; this.hostConn = conn; this.myId = id; this.room = code; res(d); }
          else if (d && d.t === 'full') fail('That room is full.');
        });
        conn.on('close', () => { if (!done) fail('Could not connect to that room.'); else if (this.hostConn === conn) this.hostLost(); });
      });
      peer.on('error', e => { if (!done) fail(e.type === 'peer-unavailable' ? 'No room found with that code.' : (e.message || e.type)); else this.peerErr(e); });
    });
    this.active = true; this.isHost = false; this.hostAI = !!welcome.hostAI;
    this.bind(); Voice.start(); this.applyPl(welcome.pl);
    return welcome;
  },
  bind() {
    const p = this.peer;
    p.on('connection', c => this.onConn(c));
    p.on('call', mc => { try { mc.answer(Voice.stream || Voice.silent()); } catch (e) {} this.wireMedia(mc); });
    p.on('disconnected', () => { if (this.active && this.peer === p) { try { p.reconnect(); } catch (e) {} } });
  },
  peerErr(e) { console.warn('peer error', e && e.type, e && e.message); if (!this.active) return; const t = now(); if (e && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type) && t - this.errT > 12) { this.errT = t; toast('Connection trouble (' + e.type + ').', 'bad'); } },

  /* ----- host side ----- */
  onConn(conn) {
    if (!this.isHost) { try { conn.close(); } catch (e) {} return; }
    conn.on('data', d => this.hostRecv(conn, d));
    conn.on('close', () => this.drop(conn.peer)); conn.on('error', () => this.drop(conn.peer));
  },
  hostRecv(conn, d) {
    if (!d || typeof d !== 'object') return; const id = conn.peer;
    if (d.t === 'hello') {
      if (this.players.size >= 6) { conn.send({ t: 'full' }); setTimeout(() => { try { conn.close(); } catch (e) {} }, 400); return; }
      const name = String(d.name || 'Agent').slice(0, 18);
      this.conns.set(id, conn);
      this.players.set(id, { name, color: String(d.color || '#3b82f6').slice(0, 9), x: 8, y: 0, z: 0, ry: 0, seat: -1, talk: false, personal: 0 });
      conn.send({ t: 'welcome', id, g: Game.netState(), hostAI: AI.hasKey(), pl: this.plObj() });
      toast(name + ' joined.', 'good'); SFX.join(); syncAvatars(this.players, this.myId); return;
    }
    const p = this.players.get(id); if (!p) return;
    if (d.t === 'pos') { p.x = +d.x || 0; p.y = +d.y || 0; p.z = +d.z || 0; p.ry = +d.ry || 0; p.seat = d.seat | 0; p.talk = !!d.talk; p.personal = +d.personal || 0; if (d.name) p.name = String(d.name).slice(0, 18); if (d.color) p.color = String(d.color).slice(0, 9); }
    else if (d.t === 'earn') Game.addTeam(clamp(+d.amt || 0, -500, 2000), id);
    else if (d.t === 'throw') { if (Array.isArray(d.o) && Array.isArray(d.v) && d.o.length === 3 && d.v.length === 3) { spawnBall(d.o.map(Number), d.v.map(Number), false); this.broadcast({ t: 'throw', o: d.o, v: d.v }, id); } }
    else if (d.t === 'ai') {
      const back = m => { try { conn.send(Object.assign({ t: 'air', rid: d.rid }, m)); } catch (e) {} };
      if (!AI.hasKey() || !Array.isArray(d.messages)) return back({ ok: false, err: 'the host has no AI key' });
      const msgs = d.messages.slice(-18).map(m => ({ role: ['system', 'user', 'assistant'].includes(m.role) ? m.role : 'user', content: String(m.content || '').slice(0, 6000) }));
      AI.raw(msgs).then(text => back({ ok: true, text })).catch(e => back({ ok: false, err: e.message }));
    }
  },
  drop(id) {
    if (!this.players.has(id)) return; const p = this.players.get(id);
    this.conns.delete(id); this.players.delete(id); this.closeMedia(id);
    toast((p.name || 'Someone') + ' left.'); syncAvatars(this.players, this.myId);
  },
  broadcast(msg, except) { if (!this.active || !this.isHost) return; for (const [id, c] of this.conns) if (id !== except && c.open) { try { c.send(msg); } catch (e) {} } },

  /* ----- client side ----- */
  clientRecv(d) {
    if (!d || typeof d !== 'object' || !this.active) return;
    if (d.t === 'snap') { this.applyPl(d.pl); Game.applyNet(d.g); Game.syncPhase(d.g); }
    else if (d.t === 'phase') Game.onPhase(d);
    else if (d.t === 'evt') { if (d.k === 'earn' && d.id !== this.myId) toast(d.amt >= 0 ? d.name + ' closed a scam: +' + money(d.amt) : d.name + ' got baited: ' + money(d.amt), d.amt >= 0 ? 'good' : 'bad'); }
    else if (d.t === 'throw') spawnBall(d.o, d.v, false);
    else if (d.t === 'air') { const w = this.waiters.get(d.rid); if (w) { this.waiters.delete(d.rid); clearTimeout(w.to); d.ok ? w.res(d.text) : w.rej(new Error(d.err || 'host AI error')); } }
  },
  applyPl(pl) { this.players = new Map(Object.entries(pl || {})); syncAvatars(this.players, this.myId); this.voiceMesh(); },
  askHostAI(messages) {
    return new Promise((res, rej) => {
      if (!this.hostConn || !this.hostConn.open) return rej(new Error('not connected'));
      const rid = ++this.rid, to = setTimeout(() => { this.waiters.delete(rid); rej(new Error('host timed out')); }, 30000);
      this.waiters.set(rid, { res, rej, to }); this.hostConn.send({ t: 'ai', rid, messages });
    });
  },
  hostLost() { if (!this.active) return; toast('The host left. Back to the main menu.', 'bad'); Game.quit(); },

  /* ----- voice mesh ----- */
  voiceMesh() {
    if (!this.active || !this.peer || !Voice.stream) return; const t = now();
    for (const id of this.players.keys()) {
      if (id === this.myId) continue; const mc = this.media.get(id);
      if (mc && !Voice.nodes.has(id) && t - mc._t > 9) { this.closeMedia(id); continue; }
      if (!mc && this.myId < id) { try { const c = this.peer.call(id, Voice.stream); if (c) this.wireMedia(c); } catch (e) {} }
    }
    for (const id of [...this.media.keys()]) if (!this.players.has(id)) this.closeMedia(id);
  },
  wireMedia(mc) {
    const id = mc.peer; mc._t = now(); this.media.set(id, mc);
    mc.on('stream', s => Voice.attach(id, s));
    mc.on('close', () => { if (this.media.get(id) === mc) { this.media.delete(id); Voice.detach(id); } });
    mc.on('error', () => {});
  },
  closeMedia(id) { const mc = this.media.get(id); this.media.delete(id); Voice.detach(id); if (mc) { try { mc.close(); } catch (e) {} } },
  swapTrack(stream) {
    const tr = stream.getAudioTracks()[0]; if (!tr) return;
    for (const mc of this.media.values()) { try { mc.peerConnection.getSenders().forEach(s => { if (s.track && s.track.kind === 'audio') s.replaceTrack(tr); }); } catch (e) {} }
  },

  sendThrow(o, v) { if (!this.active) return; const m = { t: 'throw', o, v }; if (this.isHost) this.broadcast(m); else if (this.hostConn && this.hostConn.open) this.hostConn.send(m); },
  sendEarn(amt) { if (this.hostConn && this.hostConn.open) this.hostConn.send({ t: 'earn', amt }); },
  tick(dt) {
    if (!this.active) return; this.sendT += dt;
    if (this.isHost) {
      if (this.sendT >= 0.1) { this.sendT = 0; this.players.set(this.myId, this.me()); syncAvatars(this.players, this.myId); this.voiceMesh(); this.broadcast({ t: 'snap', pl: this.plObj(), g: Game.netState() }); }
    } else if (this.sendT >= 0.066) { this.sendT = 0; if (this.hostConn && this.hostConn.open) { try { this.hostConn.send(Object.assign({ t: 'pos' }, this.me())); } catch (e) {} } }
  },
  leave() {
    const was = this.active; this.active = false;
    for (const id of [...this.media.keys()]) this.closeMedia(id); Voice.detachAll();
    for (const w of this.waiters.values()) { clearTimeout(w.to); w.rej(new Error('left')); } this.waiters.clear();
    if (this.peer) { try { this.peer.destroy(); } catch (e) {} }
    this.peer = null; this.hostConn = null; this.conns.clear(); this.players.clear(); this.isHost = false; this.room = ''; this.myId = 'me'; this.hostAI = false;
    if (was) syncAvatars(this.players, this.myId);
  }
};

/* =====================================================================
   GAME — state, day cycle, saves
   ===================================================================== */
const G = { phase: 'menu', mode: 'week', slot: 0, day: 1, quota: 0, team: 0, personal: 0, bank: 0, timeLeft: 0, dayLen: 300, paused: false,
  stats: { calls: 0, scams: 0, baited: 0, hung: 0 }, clips: 0, clipBots: 0, result: null, startedAt: 0, wallet: 0, up: {} };

function reviewLines(res) {
  const L = [], pct = res.team / Math.max(1, res.quota);
  L.push(DAYS[(res.day - 1) % 5] + '. Quota was ' + money(res.quota) + '. You brought in ' + money(res.team) + '.');
  L.push(pick(pct >= 1.5 ? BOSS.great : pct >= 1 ? BOSS.ok : pct >= 0.7 ? BOSS.close : BOSS.bad));
  if (res.players.length > 1) {
    const top = res.players[0], zero = res.players.filter(p => p.personal <= 0);
    if (top.personal > 0) L.push(top.name + ' carried this floor with ' + money(top.personal) + '.');
    if (zero.length) L.push(zero[0].name + ', I have seen houseplants generate more revenue.');
  }
  if (res.pass && res.week) L.push(BOSS.week[0]);
  L.push(pick(res.pass ? BOSS.pass : BOSS.fail));
  return L;
}

const Game = {
  quotaFor(day, n) {
    const base = 400 + 300 * (day - 1) + 25 * (day - 1) * (day - 1);
    return Math.max(100, Math.round(base * (1 + 0.7 * (Math.max(1, n) - 1)) * (G.dayLen / 300) / 50) * 50);
  },
  unlockCount() { return G.mode === 'week' ? SCHEMES.filter(s => s.unlock <= G.day).length : clamp(6 + Math.floor(G.team / 600), 6, SCHEMES.length); },
  unlocked() { return SCHEMES.slice(0, this.unlockCount()); },
  canControl() { return (G.phase === 'day' || G.phase === 'lobby') && !P.seated && !G.paused && !P.cam && P.review < 0 && !UI.settingsOpen; },
  deskTaken(i) { for (const [id, p] of Net.players) if (id !== Net.myId && p.seat === i) return true; return false; },
  roster() {
    if (!Net.active) return [{ name: settings.name, personal: G.personal, me: true }];
    return [...Net.players].map(([id, p]) => ({ name: p.name, personal: id === Net.myId ? G.personal : (p.personal || 0), me: id === Net.myId })).sort((a, b) => b.personal - a.personal);
  },
  netState() { return { phase: G.phase, mode: G.mode, day: G.day, quota: G.quota, team: G.team, timeLeft: Math.round(G.timeLeft * 10) / 10, dayLen: G.dayLen, bank: G.bank }; },
  authority() { return !Net.active || Net.isHost; },
  /* upgrades: each player has their own wallet (half of every scam) and upgrade levels */
  lvl(id) { return G.up[id] || 0; },
  addWallet(n) { G.wallet = Math.max(0, G.wallet + n); this.saveProgress(); OS.stats(); },
  buy(id) {
    const u = UPGRADES.find(x => x.id === id), lv = this.lvl(id); if (!u || lv >= u.max) return;
    const cost = u.cost * (lv + 1); if (G.wallet < cost) return;
    G.wallet -= cost; G.up[id] = lv + 1; SFX.cash(); toast(u.name + ' is now level ' + (lv + 1) + '.', 'good');
    this.saveProgress(); OS.refresh(); OS.stats();
  },
  saveProgress() {
    if (!this.authority() || G.phase === 'menu') return;
    if (G.mode === 'week') { const sv = Saves.week[G.slot]; if (sv) { sv.wallet = G.wallet; sv.up = Object.assign({}, G.up); writeSaves(); } }
    else this.saveEndless();
  },

  /* ----- starting ----- */
  begin(mode, slot) {
    resetPlayer(); OS.reset(); OS.hide(); Call.reset();
    G.mode = mode; G.slot = slot | 0; G.paused = false; G.personal = 0; G.team = 0; G.bank = 0; G.day = 1; G.quota = 0; G.timeLeft = 0;
    G.clips = 0; G.clipBots = 0; G.wallet = 0; G.up = {}; G.stats = { calls: 0, scams: 0, baited: 0, hung: 0 }; G.result = null; G.startedAt = now();
    $('#menu').classList.add('hidden'); $('#hud').classList.remove('hidden'); $('#review').classList.add('hidden'); $('#pause').classList.add('hidden');
    AudioSys.resume();
  },
  loadSave() {
    if (G.mode === 'week') {
      const sv = Saves.week[G.slot];
      if (sv) { G.day = sv.day || 1; G.bank = sv.bank || 0; G.dayLen = sv.dayLen || settings.dayLen; Object.assign(G.stats, sv.stats || {}); G.wallet = sv.wallet || 0; G.up = Object.assign({}, sv.up); }
      else { G.dayLen = settings.dayLen; this.saveWeek(1); }
    } else {
      const sv = Saves.endless; G.dayLen = 1; G.timeLeft = 0;
      if (sv) { G.team = sv.total || 0; Object.assign(G.stats, sv.stats || {}); G.wallet = sv.wallet || 0; G.up = Object.assign({}, sv.up); }
    }
  },
  saveWeek(day) { Saves.week[G.slot] = { day, bank: G.bank, dayLen: G.dayLen, stats: Object.assign({}, G.stats), wallet: G.wallet, up: Object.assign({}, G.up), updated: Date.now() }; writeSaves(); },
  saveEndless() { Saves.endless = { total: G.team, stats: Object.assign({}, G.stats), wallet: G.wallet, up: Object.assign({}, G.up), updated: Date.now() }; writeSaves(); },

  startSolo(mode, slot) { this.begin(mode, slot); this.loadSave(); this.startDay(); },
  async startHost(mode, slot) {
    const code = await Net.host();
    this.begin(mode, slot); this.loadSave();
    G.phase = 'lobby'; G.quota = G.mode === 'week' ? this.quotaFor(G.day, 1) : 0; G.timeLeft = G.dayLen;
    this.boardText(); toast('Room ' + code + ' is open. Share the code with your friends.', 'good');
  },
  async joinRoom(code) {
    const w = await Net.join(code);
    this.begin(w.g.mode, 0); this.applyNet(w.g);
    if (w.g.phase === 'day') { G.phase = 'day'; this.enterDay(true); } else { G.phase = 'lobby'; this.boardText(); if (w.g.phase === 'review') toast('A review is in progress. You will join the next day.'); }
  },
  startShift() { if (G.phase === 'lobby' && this.authority()) this.startDay(); },

  /* ----- day cycle (host / singleplayer decide, everyone runs enterDay) ----- */
  startDay() {
    G.phase = 'day';
    if (G.mode === 'week') { G.team = 0; G.quota = this.quotaFor(G.day, Net.active ? Net.players.size : 1); G.timeLeft = G.dayLen; }
    Net.broadcast({ t: 'phase', phase: 'day', g: this.netState() });
    this.enterDay();
  },
  enterDay(late) {
    leaveReview(); $('#review').classList.add('hidden'); G.result = null; placeBoss(false);
    if (G.mode === 'week' && !late) G.personal = 0;
    Call.reset(); this.boardText(); if (OS.open) OS.show();
    if (G.mode === 'week') UI.dayCard(DAYS[(G.day - 1) % 5], 'Team quota ' + money(G.quota));
    else UI.dayCard('Overtime', 'No quota. The phones never stop.');
  },
  boardText() {
    setBoard(G.mode === 'week'
      ? ['Daily targets', DAYS[(G.day - 1) % 5] + ': ' + money(G.quota), '1. Smile while dialling', '2. Do not get baited', '3. Teamwork :)']
      : ['Overtime', 'Team total: ' + money(G.team), 'No quota today', 'Go home never']);
  },
  endDay() {
    const players = this.roster().map(p => ({ name: p.name, personal: p.personal }));
    const res = { day: G.day, team: G.team, quota: G.quota, pass: G.team >= G.quota, week: G.day % 5 === 0, players };
    res.lines = reviewLines(res);
    if (res.pass) { G.bank += G.team; this.saveWeek(G.day + 1); }
    G.phase = 'review';
    Net.broadcast({ t: 'phase', phase: 'review', res, g: this.netState() });
    this.enterReview(res);
  },
  enterReview(res) {
    G.result = res; G.paused = false; $('#pause').classList.add('hidden');
    Call.shut(); TTS.stop();
    const ids = [...Net.players.keys()].sort(), idx = Net.active ? Math.max(0, ids.indexOf(Net.myId)) : 0;
    seatForReview(idx); placeBoss(true, !res.pass); UI.showReview(res);
  },
  nextDay() { if (!this.authority() || G.phase !== 'review') return; G.day++; this.startDay(); },

    if (G.phase === 'lobby') left.push('<div class="chip">' + (Game.authority() ? 'Press <kbd>Enter</kbd> to start the shift' : 'Waiting for the host to start the shift') + '</div>');
    if (P.boost > 0) left.push('<div class="chip">Caffeinated ' + Math.ceil(P.boost) + 's</div>');
    const html = left.join(''); const hl = $('#hud-left'); if (hl._h !== html) { hl._h = html; hl.innerHTML = html; }
    $('#hud-hint').classList.toggle('hidden', !(now() < this.hintUntil && Game.canControl()));
  },

  /* ----- review ----- */
  showReview(res) {
    const el = $('#review'); el.classList.remove('hidden');
    const lines = h('div', { class: 'lines' }), verdict = h('div', { class: 'verdict ' + (res.pass ? 'pass' : 'fail') }, res.pass ? 'Quota met' : 'Fired'), acts = h('div', { class: 'row' });
    const table = h('table', {}, res.players.map(p => h('tr', {}, h('td', {}, p.name), h('td', {}, money(p.personal)))), h('tr', {}, h('td', {}, h('b', {}, 'Team / quota')), h('td', {}, h('b', {}, money(res.team) + ' / ' + money(res.quota)))));
    el.replaceChildren(h('div', { class: 'rv' }, h('h2', {}, 'Performance review'), verdict, lines, table, acts));
    res.lines.forEach((l, i) => setTimeout(() => { if (G.result !== res) return; lines.append(h('p', {}, l)); SFX.click(); }, 500 + i * 1250));
    setTimeout(() => {
      if (G.result !== res) return;
      verdict.classList.add('on'); res.pass ? SFX.pass() : SFX.fired();
      if (Game.authority()) acts.append(
        res.pass ? h('button', { class: 'btn primary', onclick: () => Game.nextDay() }, 'Start ' + DAYS[res.day % 5]) : h('button', { class: 'btn primary', onclick: () => Game.retryDay() }, 'Beg for another chance (retry ' + DAYS[(res.day - 1) % 5] + ')'),
        h('button', { class: 'btn', onclick: () => Game.quit() }, res.pass ? 'Save and quit' : 'Quit to main menu'));
      else acts.append(h('span', { class: 'note', style: { color: 'inherit' } }, 'Waiting for the host…'), h('button', { class: 'btn small', onclick: () => Game.quit() }, 'Leave'));
    }, 600 + res.lines.length * 1250);
  }
};

/* =====================================================================
   INPUT + MAIN LOOP
   ===================================================================== */
let _lockT = 0;
document.addEventListener('pointerlockchange', () => { _lockT = now(); });
window.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.code === 'Escape') {
    if (UI.settingsOpen) UI.closeSettings();
    else if (G.phase !== 'menu' && now() - _lockT > 0.3) Game.pause(!G.paused);
    return;
  }
  if (typing || G.phase === 'menu') return;
  Keys[e.code] = true;
  if (e.code === 'KeyE' && W.cur && Game.canControl()) W.cur.act();
  if (e.code === 'KeyV') { Voice.ptt = true; Voice.applyMode(); }
  if (e.code === 'Enter' && G.phase === 'lobby' && !P.seated && !G.paused) Game.startShift();
  if (!P.seated && (e.code === 'Space' || e.code.startsWith('Arrow'))) e.preventDefault();
});
window.addEventListener('keyup', e => { Keys[e.code] = false; if (e.code === 'KeyV') { Voice.ptt = false; Voice.applyMode(); } });
window.addEventListener('blur', () => { for (const k in Keys) Keys[k] = false; Voice.ptt = false; Voice.applyMode(); });
window.addEventListener('pointerdown', () => AudioSys.resume(), { capture: true });

let _last = 0, _t = 0, _uiT = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - _last) / 1000 || 0.016); _last = ts; _t += dt;
  Game.tick(dt); updateWorld(dt, _t); Net.tick(dt); Voice.update();
  _uiT += dt;
  if (_uiT > 0.2) { _uiT = 0; if (G.phase !== 'menu') { if (OS.open) OS.stats(); else UI.hud(); } }
  else if (G.phase !== 'menu' && !OS.open) { const pr = $('#hud-prompt'), lab = W.cur && W.cur.label(); if (!lab !== pr.classList.contains('hidden')) UI.hud(); }
  if (!(OS.open && P.seated && !P.cam)) renderWorld();
  requestAnimationFrame(frame);
}
function boot() {
  const fail = msg => document.body.append(h('div', { class: 'overlay' }, h('div', { class: 'modal' }, h('div', { class: 'body', style: { borderTop: 0 } }, h('h2', {}, 'Could not start'), h('p', {}, msg)))));
  if (!window.THREE) return fail('The 3D engine did not load. Check your internet connection and reload the page.');
  try { initWorld(); } catch (e) { console.error(e); return fail('This browser or device could not start WebGL, which the game needs for 3D.'); }
  OS.build(); UI.build();
  window.__tli = { G, Game, Call, Net, Voice, OS, W, P, UI, settings, Saves, AI, STT, Phone, Keys };
  requestAnimationFrame(frame);
}
if (window.THREE) boot(); else { window.__threeLate = boot; setTimeout(() => { if (!window.THREE && !window.__tli) boot(); }, 6000); }

</script>
